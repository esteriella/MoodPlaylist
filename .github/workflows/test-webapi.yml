name: Test WebAPI

on:
  pull_request:
    paths:
      - 'src/MoodPlaylistApi/**'
      - 'src/MoodPlaylistApi.Tests/**'
      - 'src/MoodPlaylist.slnx'
      - '.github/workflows/test-webapi.yml'
      - '.github/workflows/deploy-webapi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore src/MoodPlaylist.slnx

      - name: Build solution
        run: dotnet build src/MoodPlaylist.slnx --configuration Release --no-restore

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Run unit tests
        run: dotnet test src/MoodPlaylist.slnx --configuration Release --no-build --filter "Category!=Integration" --verbosity normal

      - name: Run PostgreSQL Testcontainers tests
        run: dotnet test src/MoodPlaylist.slnx --configuration Release --no-build --filter "Category=Integration" --verbosity normal
