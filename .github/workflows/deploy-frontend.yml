name: Test and Deploy Next.js Frontend to Vercel

on:
  push:
    branches:
      - master
    paths:
      - 'src/MoodPlaylistWeb/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  test-build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
          cache-dependency-path: src/MoodPlaylistWeb/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./src/MoodPlaylistWeb

      - name: Lint frontend
        run: pnpm lint
        working-directory: ./src/MoodPlaylistWeb

      - name: Test frontend
        run: pnpm test
        working-directory: ./src/MoodPlaylistWeb

      - name: Build Next.js app
        run: pnpm build
        working-directory: ./src/MoodPlaylistWeb

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        working-directory: ./src/MoodPlaylistWeb
