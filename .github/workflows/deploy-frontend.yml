name: Deploy Next.js Frontend to Vercel

on:
  push:
    branches:
      - master
    paths:
      - 'src/MoodPlaylistWeb/**'

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install Node.js 20.9
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.9

      # Install pnpm globally
      - name: Install pnpm
        run: npm install -g pnpm

      # Install dependencies with pnpm
      - name: Install dependencies
        run: pnpm install
        working-directory: ./src/MoodPlaylistWeb

      # Build Next.js app with pnpm
      - name: Build Next.js app
        run: pnpm build
        working-directory: ./src/MoodPlaylistWeb

      # Deploy to Vercel
      - name: Deploy to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --scope esteriella --confirm
        working-directory: ./src/MoodPlaylistWeb
